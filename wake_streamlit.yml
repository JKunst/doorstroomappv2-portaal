name: Wake Streamlit App

on:
  schedule:
    - cron: "55 5 * * *"   # elke dag om 05:55 UTC
  workflow_dispatch:       # handmatig starten mogelijk

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app
        run: |
          for i in {1..3}
          do
            curl -I -A "Mozilla/5.0" https://doorstroomanalyse.streamlit.app/
            curl -I -A "Mozilla/5.0" https://operatiestatistiek.streamlit.app/
            sleep 20
          done
